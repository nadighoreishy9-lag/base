services:
  web:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "server.mjs"]
    environment:
      - PORT=3000
      - HOST=0.0.0.0
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/index.html').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
