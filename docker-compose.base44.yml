services:
  db:
    image: mariadb:11
    environment:
      - MARIADB_DATABASE=wordpress
      - MARIADB_USER=wordpress
      - MARIADB_PASSWORD=wordpress
      - MARIADB_ROOT_PASSWORD=wordpress
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: on-failure

  wordpress:
    build:
      context: ./wordpress
      dockerfile: Dockerfile.web
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:80"
    environment:
      - WORDPRESS_DB_HOST=db
      - WORDPRESS_DB_USER=wordpress
      - WORDPRESS_DB_PASSWORD=wordpress
      - WORDPRESS_DB_NAME=wordpress
      - WORDPRESS_DEBUG=1
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - WP_ADMIN_PASSWORD=${WP_ADMIN_PASSWORD:-nadia-dev-admin}
      # توجه: پیش‌نمایش Base44 یک پروکسی است و هدر X-Forwarded-Proto نمی‌فرستد؛ شیم مربوط به
      # هاست/پروتکل در wordpress/bin/bootstrap.sh و فقط در حالت BASE44_PREVIEW_MODE=1 ساخته می‌شود.
    volumes:
      - wp-data:/var/www/html
      # افزونه استایل از مخزن mount می‌شود تا ویرایش CSS بدون rebuild دیده شود
      - ./wordpress/plugin/nadia-design:/var/www/html/wp-content/plugins/nadia-design
      # قالب‌ها/اسکریپت‌های راه‌اندازی: همین‌ها را bootstrap.sh می‌خواند
      - ./wordpress:/source:ro
      # صفحه دانلود فایل‌ها (/nadia-downloads/) + خود فایل‌ها (/nadia-package/)
      - ./wordpress/downloads:/var/www/html/nadia-downloads:ro
      - ./wordpress/nadia-elementor-site.zip:/var/www/html/nadia-package/nadia-elementor-site.zip:ro
      - ./wordpress/elementor:/var/www/html/nadia-package/templates:ro
    # راه‌اندازی idempotent (نصب المنتور، زبان فارسی و ساخت سه صفحه) داخل همین سرویس اجرا
    # می‌شود؛ به‌همین دلیل سرویس one-shot جدا وجود ندارد و هیچ سرویسی «exited» نمی‌ماند.
    entrypoint: ["/bin/sh", "/source/bin/entrypoint-web.sh"]
    healthcheck:
      # /index.php مستقیم پاسخ ۲۰۰ می‌دهد؛ wp-login.php روی این پروکسی ریدایرکت می‌شود و
      # سلامت‌سنج نباید دنبال ریدایرکت بیرونی برود. start_period باید از مدت راه‌اندازی
      # (نصب افزونه/قالب و ساخت صفحات) بیشتر باشد.
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(@file_get_contents('http://127.0.0.1/index.php') ? 0 : 1);",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 240s
    restart: on-failure

volumes:
  db-data:
  wp-data:
